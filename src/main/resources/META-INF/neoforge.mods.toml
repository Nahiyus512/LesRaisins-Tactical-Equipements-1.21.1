modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/LesRaisins/LesRaisins-Tactical-Equipements/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''${mod_description}'''
authors="${mod_authors}"
logoFile="lrtactical.png"
mixins=[{config="lrtactical.mixins.json"}]

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neoforge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="tacz"
type="required"
versionRange="[1.0.4,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="playeranimator"
type="optional"
versionRange="[2.0.1,)"
ordering="AFTER"
side="CLIENT"
